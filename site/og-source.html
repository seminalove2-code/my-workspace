<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- og.png 를 만드는 원본 (1200x630). 사진이 생기면 왼쪽에 넣고 다시 캡처 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;display:grid;grid-template-columns:1fr 1fr;font-family:"Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.05em;overflow:hidden}
.l{background:#111;color:#fff;padding:64px 56px;display:flex;flex-direction:column;justify-content:flex-end}
.r{background:#ffd400;color:#111;padding:64px 56px;display:flex;flex-direction:column;justify-content:flex-end}
.tag{align-self:flex-start;font-size:22px;font-weight:800;padding:6px 12px;margin-bottom:20px;letter-spacing:-.02em}
.l .tag{background:#ffd400;color:#111}.r .tag{background:#111;color:#ffd400}
.big{font-size:130px;font-weight:900;line-height:1}
.sub{font-size:44px;font-weight:900;margin-top:10px}
.brand{position:absolute;top:44px;left:56px;font-size:28px;font-weight:900;color:#fff;letter-spacing:-.03em}
</style></head><body>
<span class="brand">인카다이렉트 설계사 모집</span>
<div class="l"><span class="tag">베이비페어</span><p class="big">매주</p><p class="sub">박람회가 열려요</p></div>
<div class="r"><span class="tag">사업자 DB</span><p class="big">매일 2건</p><p class="sub">대표님이 배정돼요</p></div>
</body></html>
