# ── 네이버 블로그 자동포스팅 설정 ──

# 내 블로그 아이디 (blog.naver.com/여기부분)
blog_id: "hotpickconnect"

# topic.txt 의 "종류:" 별로 올릴 카테고리 (블로그 카테고리 이름과 똑같이)
categories:
  출고후기: "BMW출고후기"
  차량정보: "BMW차량정보"
  프로모션: "프로모션"
  일상기록: "일상기록"
  상담견적: "상담·견적"

# 종류가 없거나 위에 없는 종류일 때 올릴 카테고리. 비워두면 기본 카테고리.
category: ""

# true: 바로 발행 / false: 임시저장만 (네이버에서 직접 확인 후 발행)
# 처음 두 달은 false 로 두고 최현정 대리가 확인 후 발행합니다.
publish: false

# true: PC에 설치된 크롬 사용 (권장) / false: Playwright 내장 크로미움 사용
use_chrome: true

# 브라우저 창을 숨길지 여부. 처음엔 false로 두고 잘 되는지 눈으로 확인하세요.
headless: false

# 번호판 자동 가리기: true 면 글 쓰기 전에 AI가 번호판을 찾아 모자이크한 사본을 '가림' 폴더에 만들고,
# 블로그에는 그 사진만 올립니다. 결과는 꼭 '가림' 폴더에서 눈으로 확인하세요.
# 사진을 미리 직접 가렸다면 그 글의 topic.txt 에 "번호판: 직접 가림" 한 줄을 넣으면 건너뜁니다. (API 비용 없음)
blur_plates: true

# ── AI 글쓰기 설정 ──
# 글을 쓸 AI: claude / openai / gemini  (.env 에 그 회사의 API 키가 있어야 합니다)
ai: "openai"

# 회사별 모델 이름. 쓸 수 있는 이름은 models.bat 으로 확인하세요.
models:
  claude: "claude-opus-5-5"
  openai: "gpt-5.5"
  gemini: "gemini-3.5-flash"

# Claude 꼼꼼함: low / medium / high (높을수록 느리고 비쌈)
effort: "medium"
# OpenAI 추론 모델의 꼼꼼함. 오류가 나면 이 줄 앞에 # 을 붙여 끄세요.
openai_reasoning: "medium"

# 레퍼런스 글과 별개로 항상 지킬 규칙
style: |
  [글쓴이 페르소나]
  - BMW 한독모터스 용산전시장 최현정 대리 (여성 딜러, Sales Consultant)
  - 2025년 입사. 경력은 짧지만 거의 매달 최우수 사원으로 뽑힐 만큼 열정이 넘칩니다.
  - 고객 한 분 한 분을 끝까지 챙기고, 출고 후에도 먼저 연락드리는 딜러입니다.
  - 말투: 밝고 따뜻한 존댓말. 차 설명은 꼼꼼하고 쉽게, 고객 이야기는 진심이 느껴지게 씁니다.
  - 고객님께 "감사합니다", "축하드립니다"처럼 마음을 표현하는 문장을 자연스럽게 넣습니다.
  - 최우수 사원 이야기는 자랑처럼 매번 넣지 말고, 어울리는 글에서만 가끔 한 줄로 씁니다.
    ("매달"이 아니라 "거의 매달"처럼 사실 그대로만 씁니다.)

  [인사말]
  - "안녕하세요. BMW 한독모터스 용산전시장 최현정 대리입니다."

  [항상 지킬 규칙]
  - 메모, 사진, 가격표에 없는 사실(가격, 사양, 프로모션, 재고 등)은 지어내지 않습니다.
  - 고객님 실명, 연락처, 차량 번호는 쓰지 않습니다.
  - 광고 문구처럼 과장하지 않습니다. "최저가", "무조건" 같은 단정 표현은 쓰지 않습니다.

