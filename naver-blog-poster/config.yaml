# ── 네이버 블로그 자동포스팅 설정 ──

# 내 블로그 아이디 (blog.naver.com/여기부분)
blog_id: "my_blog_id"

# topic.txt 의 "종류:" 별로 올릴 카테고리 (블로그 카테고리 이름과 똑같이)
categories:
  출고후기: "출고후기"
  차량정보: "차량정보"
  프로모션: "프로모션"
  일상기록: "일상기록"

# 종류가 없거나 위에 없는 종류일 때 올릴 카테고리. 비워두면 기본 카테고리.
category: ""

# true: 바로 발행 / false: 임시저장만 (네이버에서 직접 확인 후 발행)
publish: true

# true: PC에 설치된 크롬 사용 (권장) / false: Playwright 내장 크로미움 사용
use_chrome: true

# 브라우저 창을 숨길지 여부. 처음엔 false로 두고 잘 되는지 눈으로 확인하세요.
headless: false

# ── AI 글쓰기 설정 ──
model: "claude-opus-5-5"
# low / medium / high : 높을수록 꼼꼼하지만 느리고 비쌉니다.
effort: "medium"

# 레퍼런스 글과 별개로 항상 지킬 규칙
style: |
  - 인사말: "안녕하세요. BMW 한독모터스 용산전시장 최현정 대리입니다."
  - 마무리: 마지막에 아래 상담 안내를 그대로 넣습니다.
      BMW 한독모터스 용산전시장 최현정 대리
      서울시 용산구 청파로 241
      차량 상담 010-3228-3729
  - 친근한 존댓말로 씁니다.
  - 메모와 사진에 없는 사실(가격, 사양, 프로모션, 재고 등)은 지어내지 않습니다.
  - 고객님 실명, 연락처, 차량 번호는 쓰지 않습니다.
  - 광고 문구처럼 과장하지 않습니다.
